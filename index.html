<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Possir: kasir, stok, piutang, pengeluaran, dan laporan untuk usaha mahasiswa Indonesia di Mesir. Semua pakai EGP."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Possir" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Possir · Kasir usaha Masisir</title>
    <script>
      // Pasang tema sebelum React jalan supaya tidak berkedip
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('possir.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
